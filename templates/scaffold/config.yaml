site:
  title: "내 블로그"
  url: "https://myblog.com"
  description: "개발, 학습, 리뷰 잡다한 노트"
  author: "작성자"
  email: "your-email@example.com"
  social:
    github: "https://github.com/your-username"
    twitter: "https://x.com/your-username"
    # linkedin: "https://linkedin.com/in/your-username"
    # instagram: "https://instagram.com/your-username"

taxonomy:
  tags:
    label: "태그"
    slug: "/tags"
  topics:
    label: "주제"
    slug: "/topics"
  keywords:
    label: "키워드"
    slug: "/keywords"
  category:
    label: "카테고리"
    slug: "/categories"

theme:
  darkMode: true
  sidebar: "left"
  toc: "right"
  # accentColor: "#58a6ff"  # 원하는 accent 색상으로 변경

database:
  provider: "supabase"
  url: "env:SUPABASE_URL"
  key: "env:SUPABASE_KEY"

build:
  output: "dist"
  incremental: false
